<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Executive Advantage Score | Adrian Evans</title>
<style>
  :root{
    --navy:#29245c;
    --orange:#e9761b;
    --navy-light:#3a3478;
    --navy-pale:#f0effa;
    --orange-pale:#fef4e8;
    --border:#d9d6ee;
    --muted:#6b6888;
    --ink:#1a1833;
    --rag-green:#2e9e4f;
    --rag-amber:#e0a527;
    --rag-red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#f7f7fb;
    color:var(--ink);
  }
  header{
    background:var(--navy);
    padding:16px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header img{
    height:100px;
    width:auto;
    display:block;
    object-fit:contain;
    cursor:pointer;
  }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#fff;
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    padding:8px 16px;
    border:1.5px solid rgba(255,255,255,.35);
    border-radius:8px;
    transition:background .15s,border-color .15s;
    white-space:nowrap;
  }
  .home-btn:hover{
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.6);
  }
  #app{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  .eyebrow{font-size:13px;color:var(--orange);letter-spacing:.06em;margin:0 0 8px;text-transform:uppercase;font-weight:600;}
  h1{font-size:28px;font-weight:700;margin:0 0 14px;line-height:1.25;color:var(--navy);}
  h2{font-size:19px;font-weight:700;margin:0 0 20px;color:var(--navy);}
  p{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 16px;}
  .progress{height:5px;background:var(--border);border-radius:4px;margin-bottom:32px;overflow:hidden;}
  .progress-fill{height:5px;background:var(--orange);transition:width .25s;}
  .stage-label{font-size:13px;color:var(--orange);font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em;}
  .item{margin-bottom:24px;}
  .item-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;}
  .item-label{font-size:14.5px;line-height:1.5;color:var(--ink);flex:1;min-width:0;}
  .item-score{
    font-size:15px;font-weight:700;min-width:48px;text-align:center;
    background:var(--navy);color:#fff;border-radius:6px;padding:4px 8px;
    flex-shrink:0;white-space:nowrap;
  }
  input[type=range]{width:100%;accent-color:var(--orange);cursor:pointer;}
  .scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;width:100%;}
  input[type=email],input[type=text]{
    width:100%;max-width:340px;padding:11px 14px;
    border:1.5px solid var(--border);border-radius:8px;
    font-size:15px;margin-bottom:10px;font-family:inherit;
    outline:none;
  }
  input[type=email]:focus,input[type=text]:focus{border-color:var(--orange);}
  .btn{
    border:none;padding:11px 24px;border-radius:8px;font-size:14.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-secondary{background:none;border:1.5px solid var(--border);color:var(--ink);}
  .btn-row{display:flex;justify-content:space-between;margin-top:16px;}
  .instruction{
    font-size:13px;color:var(--muted);margin:-8px 0 20px;
    padding:10px 14px;background:var(--navy-pale);border-left:4px solid var(--orange);
    border-radius:0 8px 8px 0;line-height:1.6;
  }
  .instruction strong{color:var(--navy);}
  .score-total{text-align:center;margin-bottom:28px;}
  .score-num{font-size:52px;font-weight:800;color:var(--navy);}
  .score-max{font-size:20px;color:var(--muted);font-weight:400;}
  .band-pill{
    display:inline-block;margin-top:10px;padding:7px 20px;border-radius:20px;
    background:var(--orange);color:#fff;font-size:13px;font-weight:700;letter-spacing:.03em;
  }
  .stage-bar-wrap{margin-bottom:12px;}
  .stage-bar-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink);}
  .stage-bar-bg{height:9px;border-radius:4px;background:var(--border);overflow:hidden;}
  .stage-bar-fill{height:9px;border-radius:4px;background:var(--orange);}
  .rag-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .rag-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .focus-box{background:var(--navy-pale);border-radius:12px;padding:18px 20px;margin:24px 0;border:1.5px solid var(--border);}
  .focus-title{font-size:12px;font-weight:800;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);}
  .focus-item{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--muted);}
  .focus-item:last-child{border-bottom:none;}
  .focus-item span:first-child{flex:1;}
  .focus-score{font-weight:700;color:var(--orange);white-space:nowrap;flex-shrink:0;min-width:44px;text-align:right;}
  .footer-note{font-size:13px;color:var(--muted);text-align:center;border-top:1.5px solid var(--border);padding-top:18px;margin-top:24px;}
  .err{color:#c0392b;font-size:13px;margin:-4px 0 12px;}
  .divider{height:1.5px;background:var(--border);margin:28px 0;}

  /* =====================
     MOBILE RESPONSIVE
     ===================== */
  @media (max-width: 600px) {

    /* Global layout */
    #app {
      padding: 24px 18px 60px;
    }

    header {
      padding: 14px 18px;
    }

    header img {
      height: 56px;
    }

    .home-btn {
      font-size: 12px;
      padding: 6px 10px;
    }

    /* Typography */
    h1 {
      font-size: 22px;
      line-height: 1.3;
    }

    h2 {
      font-size: 17px;
    }

    p {
      font-size: 14px;
    }

    .eyebrow {
      font-size: 11px;
    }

    /* Buttons  full width on mobile */
    .btn {
      width: 100%;
      text-align: center;
      padding: 13px 16px;
      font-size: 15px;
    }

    .btn-row {
      flex-direction: column-reverse;
      gap: 10px;
    }

    /* Inputs  full width */
    input[type=email],
    input[type=text] {
      max-width: 100%;
      font-size: 16px; /* prevents iOS zoom on focus */
      padding: 13px 14px;
    }

    /* Slider items */
    .item {
      margin-bottom: 28px;
    }

    .item-row {
      flex-wrap: nowrap;
      gap: 10px;
    }

    .item-label {
      font-size: 14px;
    }

    .item-score {
      font-size: 14px;
      min-width: 40px;
    }

    /* Instruction box */
    .instruction {
      font-size: 13px;
      padding: 10px 12px;
    }

    /* Stage label */
    .stage-label {
      font-size: 12px;
    }

    /* Results  score total */
    .score-num {
      font-size: 42px;
    }

    .score-max {
      font-size: 16px;
    }

    .band-pill {
      font-size: 12px;
      padding: 6px 14px;
    }

    /* Stage bars */
    .stage-bar-row {
      font-size: 13px;
    }

    /* Results  expanded step rows */
    .stage-bar-wrap > div[style*="border"] div[style*="display:flex"] {
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Focus box */
    .focus-box {
      padding: 14px 14px;
    }

    .focus-title {
      font-size: 11px;
    }

    .focus-item {
      font-size: 13px;
      gap: 10px;
    }

    .focus-score {
      min-width: 40px;
    }

    /* Divider */
    .divider {
      margin: 20px 0;
    }

    /* Footer note */
    .footer-note {
      font-size: 13px;
    }
  }

</style>
</head>

let values = {};
let step = 0;
let nameVal = "";
let emailVal = "";
const screens = ["intro"].concat(sections.map((s,i)=>"s"+i)).concat(["contact","results"]);
const root = document.getElementById("app");

function maxForSection(s){ return s.items.reduce((a,it)=>a+it.weight*10,0); }

function goHome(){
  step = 0;
  values = {};
  nameVal = "";
  emailVal = "";
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function render(){
  const screen = screens[step];
  if(screen==="intro") return renderIntro();
  if(screen==="contact") return renderContact();
  if(screen==="results") return renderResults();
  renderSection(parseInt(screen.slice(1),10));
}

function progressBar(){
  const pct = Math.round((step/(screens.length-1))*100);
  return `<div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>`;
}

function renderIntro(){
  root.innerHTML = `
    <p class="eyebrow">The Executive Advantage Score &middot; Adrian Evans</p>
    <h1>Measuring Your Progress to Secure Your Next Executive Position</h1>
    <p>Executives do not struggle to secure their next role because of a lack of talent; they struggle because they lack a proven methodology.</p>
      <p style="font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 14px;">I have invested three decades supporting executives in their careers. The last 15 years operating exclusively as an advisor to senior executives. That proximity, the lessons learnt, and the relationships built, informs the judgement and perspective I bring to every conversation.</p>
      <p style="font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 14px;">This proven 14-step career framework enables executives to create opportunities rather than chase them. This has proved effective even in the most challenging job markets (2008/09) and hundreds of executives have utilised it to secure their next role, often generating multiple offers and greater career choice.</p>
      <p style="font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 28px;">Rate yourself honestly across <strong>14 steps in 5 stages</strong>. Less than 4 minutes. You will receive a score out of 200 and a clarity of where to focus first.</p>
    <div class="divider"></div>
    <button class="btn btn-primary" id="start-btn" style="width:100%;margin-top:8px;">Start the Diagnostic &rarr;</button>
  `;
  document.getElementById("start-btn").onclick = ()=>{ step++; render(); };
}

function renderSection(idx){
  const s = sections[idx];
  let html = progressBar();
  html += `<p class="stage-label">Stage ${idx+1} of ${sections.length}</p>`;
  html += `<h2>${s.name}</h2>`;
  html += `<p style="font-size:14px;color:var(--muted);line-height:1.6;margin:-8px 0 16px;font-style:italic;">${sectionDescs[s.name]}</p>`;
  html += `<div class="instruction">&#128073; <strong>How to score:</strong> Slide the button to select your answer. <strong>0</strong> means this does not apply at all  <strong>10</strong> means completely true.</div>`;
  s.items.forEach(it=>{
    if(values[it.key]===undefined) values[it.key]=0;
    const v = values[it.key];
    html += `
      <div class="item">
        <div class="item-row">
          <label class="item-label" style="flex:1;min-width:0;">${it.label}</label>
          <span class="item-score" id="out-${it.key}" style="flex-shrink:0;min-width:48px;text-align:center;">${v}</span>
        </div>
        <input type="range" min="0" max="10" step="1" value="${v}" data-key="${it.key}">
        <div class="scale-labels"><span>0 - Not at all</span><span>10 - Completely true</span></div>
      </div>`;
  });
  html += `<div class="btn-row">`;
  html += idx===0 ? `<span></span>` : `<button class="btn btn-secondary" id="back-btn">&larr; Back</button>`;
  html += `<button class="btn btn-primary" id="next-btn">${idx===sections.length-1?"Continue &rarr;":"Continue &rarr;"}</button>`;
  html += `</div>`;
  root.innerHTML = html;

  s.items.forEach(it=>{
    root.querySelector(`input[data-key="${it.key}"]`).addEventListener("input", e=>{
      values[it.key] = parseInt(e.target.value,10);
      document.getElementById(`out-${it.key}`).textContent = values[it.key];
    });
  });
  const backBtn = document.getElementById("back-btn");
  if(backBtn) backBtn.onclick = ()=>{ step--; render(); };
  document.getElementById("next-btn").onclick = ()=>{ step++; render(); };
}

function renderContact(){
  let html = progressBar();
  html += `<h2>Almost There</h2>`;
  html += `<p>Enter your details below to reveal your score and full breakdown.</p>`;
  html += `<div class="instruction" style="margin-bottom:16px;">&#9888;&#65039; <strong>Important:</strong> Please use a <strong>personal email address</strong> (e.g. Gmail, Hotmail, Yahoo). Corporate email addresses may block delivery of your results.</div>`;
  html += `<input type="text" id="name-input" placeholder="Full name" value="${nameVal}"><br>`;
  html += `<input type="email" id="email-input" placeholder="your.name@gmail.com" value="${emailVal}">`;
  html += `<div id="contact-err" class="err" style="display:none;">Please enter your full name and a valid personal email address.</div>`;
  html += `<div class="btn-row" style="margin-top:8px;">
    <button class="btn btn-secondary" id="back-btn">&larr; Back</button>
    <button class="btn btn-primary" id="reveal-btn">Reveal My Score &rarr;</button>
  </div>`;
  root.innerHTML = html;
  document.getElementById("back-btn").onclick = ()=>{ step--; render(); };
  document.getElementById("reveal-btn").onclick = ()=>{
    nameVal = document.getElementById("name-input").value.trim();
    emailVal = document.getElementById("email-input").value.trim();
    if(!nameVal || !emailVal || !emailVal.includes("@")){
      document.getElementById("contact-err").style.display="block";
      return;
    }
    step++; render();
  };
}

function ragStatus(pct){
  if(pct>=80) return {label:"Green", color:"var(--rag-green)", bg:"#eaf7ee"};
  if(pct>=60) return {label:"Amber", color:"var(--rag-amber)", bg:"#fdf5e3"};
  return {label:"Red", color:"var(--rag-red)", bg:"#fbebe9"};
}

function renderResults(){
  let total = 0;
  const allItems = [];
  const sectionScores = sections.map(s=>{
    const sc = s.items.reduce((a,it)=>a+(values[it.key]||0)*it.weight,0);
    total += sc;
    s.items.forEach(it=> allItems.push({label:it.label, raw:values[it.key]||0}));
    return {name:s.name, score:sc, max:maxForSection(s), items:s.items.map(it=>({label:it.label, raw:values[it.key]||0}))};
  });
  const band = bands.find(b=>total>=b.min && total<=b.max) || bands[0];
  const focus = allItems.slice().sort((a,b)=>a.raw-b.raw).slice(0,3);

  const todayStr = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});

  let html = `
    <p style="text-align:center;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--orange);margin-bottom:6px;">THE EXECUTIVE ADVANTAGE SCORE</p>
    <div style="text-align:center;">
      <span class="score-num" style="font-size:40px;">${total}</span><span class="score-max"> / 200</span>
    </div>
    <div style="text-align:center;margin:8px 0 10px;"><span class="band-pill">${band.label}</span></div>
    <p style="text-align:center;font-size:13.5px;color:var(--muted);margin:0 0 18px;">${band.desc || ''}</p>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px;">
      <span>Executive: ${nameVal || '&mdash;'}</span>
      <span>Date: ${todayStr}</span>
    </div>
    <div class="divider"></div>
    <h2 style="margin-bottom:16px;">Stage Breakdown</h2>`;

  sectionScores.forEach(s=>{
    const pct = Math.round((s.score/s.max)*100);
    const rag = ragStatus(pct);
    html += `
      <div class="stage-bar-wrap" style="margin-bottom:22px;">
        <div class="stage-bar-row">
          <span style="font-weight:700;">${s.name}</span>
          <span style="font-size:12.5px;font-weight:700;color:${rag.color};">&#9679; ${pct}% &middot; ${rag.label}</span>
        </div>
        <div class="stage-bar-bg" style="margin-bottom:8px;"><div class="stage-bar-fill" style="width:${pct}%;background:${rag.color};"></div></div>
        <p style="font-size:13px;color:var(--muted);line-height:1.5;font-style:italic;margin:0 0 10px;">${sectionDescs[s.name] || ''}</p>`;
    s.items.forEach(it=>{
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;">
          <span style="font-size:13.5px;color:var(--ink);line-height:1.4;flex:1;">${it.label}</span>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <div style="width:60px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;">
              <div style="height:100%;width:${(it.raw/10)*100}%;background:var(--orange);"></div>
            </div>
            <span style="font-size:13px;font-weight:700;color:var(--ink);min-width:38px;text-align:right;">${it.raw} / 10</span>
          </div>
        </div>`;
    });
    html += `
        <p style="text-align:right;font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--navy);margin:8px 0 0;">STAGE TOTAL&nbsp;&nbsp;${s.score} / ${s.max}</p>
      </div>`;
  });

  html += `<div class="divider"></div>
    <div style="background:var(--navy-pale);border-radius:10px;padding:14px 16px;">
      <p style="font-weight:700;color:var(--navy);margin-bottom:10px;">KEY FOCUS AREAS</p>`;
  focus.forEach((f,i)=>{
    html += `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:8px 0;${i<focus.length-1?"border-bottom:1px solid var(--border);":""}">
        <span style="font-size:14px;color:var(--ink);line-height:1.5;">${f.label}</span>
        <span style="font-size:14px;font-weight:700;color:var(--orange);white-space:nowrap;flex-shrink:0;">${f.raw} / 10</span>
      </div>`;
  });
  html += `</div>
    <div class="divider"></div>
    <p id="submit-status" style="margin-bottom:20px;">Sending your result to Adrian...</p>
    <p style="font-weight:700;color:var(--navy);margin-bottom:2px;">Adrian Evans</p>
    <p style="margin-bottom:2px;">The Executive Advantage</p>
    <p style="margin-bottom:20px;">adrian@adrianevans.co.uk</p>
    <button class="btn btn-primary" id="download-pdf-btn" style="margin-top:10px;width:100%;">Download Your Results (PDF)</button>
    <button class="btn btn-secondary" id="retake-btn" style="margin-top:10px;width:100%;">Retake the Diagnostic</button>`;

  root.innerHTML = html;
  const payload = {name:nameVal, email:emailVal, total, band:band.label, bandDesc:band.desc, sectionScores, focus};
  document.getElementById("retake-btn").onclick = ()=>{ step=0; values={}; render(); };
  document.getElementById("download-pdf-btn").onclick = async (e)=>{
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.textContent = "Preparing PDF...";
    btn.disabled = true;
    try{
      const doc = await buildResultsPDF(payload);
      doc.save(`${(payload.name||"Executive-Advantage-Score").replace(/[^a-z0-9]+/gi,"-")}.pdf`);
    }catch(err){
      alert("Sorry, the PDF could not be generated. Please try again.");
    }finally{
      btn.textContent = original;
      btn.disabled = false;
    }
  };
  submitResult(payload);
}

async function loadImageAspect(src){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=> resolve(img.width / img.height);
    img.onerror = ()=> resolve(1900/1085);
    img.src = src;
  });
}

async function buildResultsPDF(payload){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const navy = "#29245c";
  const orange = "#e9761b";
  const muted = "#6b6888";
  const ink = "#1a1833";
  const ragHex = { Green:"#2e9e4f", Amber:"#e0a527", Red:"#c0392b" };

  // Header band with logo
  const logoSrc = document.querySelector("header img").src;
  const aspect = await loadImageAspect(logoSrc);
  const logoH = 14;
  const logoW = logoH * aspect;
  doc.setFillColor(navy);
  doc.rect(0, 0, pageW, 28, "F");
  doc.addImage(logoSrc, "PNG", 14, 7, logoW, logoH);
  doc.setTextColor("#ffffff");
  doc.setFontSize(11);
  doc.setFont(undefined, "bold");
  doc.text("The Executive Advantage Score", pageW - 14, 16, { align:"right" });

  let y = 38;

  // Title + score summary
  doc.setFontSize(10);
  doc.setFont(undefined, "bold");
  doc.setTextColor(orange);
  doc.text("THE EXECUTIVE ADVANTAGE SCORE", pageW / 2, y, { align:"center", charSpace:0.5 });
  y += 12;
  doc.setFontSize(28);
  doc.setFont(undefined, "bold");
  doc.setTextColor(navy);
  doc.text(`${payload.total} / 200`, pageW / 2, y, { align:"center" });
  y += 8;
  doc.setFontSize(12);
  doc.setTextColor("#ffffff");
  doc.setFillColor(orange);
  const bandLabel = payload.band;
  const bandW = doc.getTextWidth(bandLabel) + 12;
  doc.roundedRect(pageW / 2 - bandW / 2, y - 5, bandW, 8, 4, 4, "F");
  doc.text(bandLabel, pageW / 2, y, { align:"center" });
  y += 8;
  if(payload.bandDesc){
    doc.setFontSize(9.5);
    doc.setFont(undefined, "normal");
    doc.setTextColor(muted);
    doc.text(payload.bandDesc, pageW / 2, y, { align:"center" });
    y += 8;
  }

  doc.setFontSize(9.5);
  doc.setTextColor(muted);
  if(payload.name) doc.text(`Executive: ${payload.name}`, 14, y);
  doc.text(`Date: ${new Date().toLocaleDateString("en-GB")}`, pageW - 14, y, { align:"right" });
  y += 8;

  doc.setDrawColor("#d9d6ee");
  doc.line(14, y, pageW - 14, y);
  y += 10;

  // Stage breakdown
  doc.setFontSize(13);
  doc.setTextColor(navy);
  doc.setFont(undefined, "bold");
  doc.text("Stage Breakdown", 14, y);
  y += 7;

  payload.sectionScores.forEach(s=>{
    const pct = Math.round((s.score / s.max) * 100);
    const rag = pct >= 80 ? "Green" : pct >= 60 ? "Amber" : "Red";
    const ragColor = ragHex[rag];

    if(y > 250){ doc.addPage(); y = 20; }

    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.setTextColor(ink);
    doc.text(s.name, 14, y);
    doc.setTextColor(ragColor);
    doc.text(`${pct}% - ${rag}`, pageW - 14, y, { align:"right" });
    y += 4;

    const barW = pageW - 28;
    doc.setFillColor("#e5e2f5");
    doc.roundedRect(14, y, barW, 3.2, 1.6, 1.6, "F");
    doc.setFillColor(ragColor);
    doc.roundedRect(14, y, Math.max(barW * (pct / 100), 3.2), 3.2, 1.6, 1.6, "F");
    y += 6;

    if(sectionDescs[s.name]){
      doc.setFontSize(8.5);
      doc.setFont(undefined, "italic");
      doc.setTextColor(muted);
      const descLines = doc.splitTextToSize(sectionDescs[s.name], pageW - 28);
      doc.text(descLines, 14, y);
      y += descLines.length * 4 + 3;
    }

    (s.items || []).forEach(it=>{
      if(y > 265){ doc.addPage(); y = 20; }
      doc.setFontSize(9.5);
      doc.setFont(undefined, "normal");
      doc.setTextColor(ink);
      const labelLines = doc.splitTextToSize(it.label, pageW - 65);
      doc.text(labelLines, 14, y);
      const miniBarW = 18;
      const miniBarX = pageW - 14 - miniBarW - 14;
      doc.setFillColor("#e5e2f5");
      doc.roundedRect(miniBarX, y - 3, miniBarW, 2.4, 1.2, 1.2, "F");
      doc.setFillColor(orange);
      doc.roundedRect(miniBarX, y - 3, Math.max(miniBarW * (it.raw / 10), 2.4), 2.4, 1.2, 1.2, "F");
      doc.setFont(undefined, "bold");
      doc.text(`${it.raw} / 10`, pageW - 14, y, { align:"right" });
      y += Math.max(labelLines.length * 4, 5) + 2;
    });

    doc.setFontSize(9);
    doc.setFont(undefined, "bold");
    doc.setTextColor(navy);
    doc.text(`STAGE TOTAL   ${s.score} / ${s.max}`, pageW - 14, y, { align:"right" });
    y += 10;
  });

  y += 3;
  doc.setDrawColor("#d9d6ee");
  doc.line(14, y, pageW - 14, y);
  y += 10;
  if(y > 250){ doc.addPage(); y = 20; }

  // Key focus areas
  doc.setFontSize(12);
  doc.setFont(undefined, "bold");
  doc.setTextColor(navy);
  doc.text("Key Focus Areas", 14, y);
  y += 7;
  doc.setFontSize(10);
  doc.setFont(undefined, "normal");
  doc.setTextColor(ink);
  payload.focus.forEach((f, i)=>{
    doc.text(`${i + 1}. ${f.label}`, 14, y, { maxWidth: pageW - 60 });
    doc.setTextColor(orange);
    doc.setFont(undefined, "bold");
    doc.text(`${f.raw} / 10`, pageW - 14, y, { align:"right" });
    doc.setTextColor(ink);
    doc.setFont(undefined, "normal");
    y += 8;
  });

  y += 6;
  doc.setDrawColor("#d9d6ee");
  doc.line(14, y, pageW - 14, y);
  y += 10;
  if(y > 260){ doc.addPage(); y = 20; }

  doc.setFontSize(10);
  doc.setTextColor(muted);
  doc.text("Result sent to Adrian. He will follow up to walk through your weakest stage.", 14, y);
  y += 10;
  doc.setFont(undefined, "bold");
  doc.setTextColor(navy);
  doc.text("Adrian Evans", 14, y); y += 5;
  doc.setFont(undefined, "normal");
  doc.setTextColor(muted);
  doc.text("The Executive Advantage", 14, y); y += 5;
  doc.text("adrian@adrianevans.co.uk", 14, y);

  return doc;
}

async function submitResult(payload){
  const statusEl = document.getElementById("submit-status");
  if(!WEBHOOK_URL){
    if(statusEl) statusEl.textContent = "Adrian will follow up to walk through your weakest stage.";
    return;
  }
  let pdfBase64 = "";
  let pdfFilename = "";
  let emailHtml = "";
  try{
    const doc = await buildResultsPDF(payload);
    const dataUri = doc.output("datauristring");
    pdfBase64 = dataUri.split(",")[1] || "";
    pdfFilename = `${(payload.name||"Executive-Advantage-Score").replace(/[^a-z0-9]+/gi,"-")}.pdf`;
  }catch(err){
    // If PDF generation fails, still send the score data without an attachment.
  }
  try{
    emailHtml = buildResultsEmailHTML(payload);
  }catch(err){
    // If email HTML generation fails, Zapier can still fall back to its own plain-text template.
  }
  try{
    await fetch(WEBHOOK_URL,{
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        timestamp: new Date().toISOString(),
        name: payload.name,
        email: payload.email,
        total_score: payload.total,
        band: payload.band,
        foundation_score: payload.sectionScores[0].score,
        go_to_market_score: payload.sectionScores[1].score,
        methodology_score: payload.sectionScores[2].score,
        platform_to_shine_score: payload.sectionScores[3].score,
        close_and_win_score: payload.sectionScores[4].score,
        lowest_step_1: payload.focus[0]?.label || "",
        lowest_step_2: payload.focus[1]?.label || "",
        lowest_step_3: payload.focus[2]?.label || "",
        pdf_filename: pdfFilename,
        pdf_base64: pdfBase64,
        email_html: emailHtml
      })
    });
    if(statusEl) statusEl.textContent = "Result sent to Adrian. He will follow up to walk through your weakest stage.";
  }catch(err){
    if(statusEl) statusEl.textContent = "Adrian will follow up to walk through your weakest stage.";
  }
}

render();
</script>
